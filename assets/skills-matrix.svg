<svg width="100%" height="380" viewBox="0 0 840 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="840" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF7F50" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="gradMaster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FF7F50"/>
    </linearGradient>

    <linearGradient id="gradInter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="gradPrompt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="gradSql" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.8px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94A3B8; }
    .skill-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 600; fill: #F8FAFC; }
    .skill-tags { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; }
    .pct-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #F1F5F9; }

    @keyframes expandBar1 { from { width: 0px; } to { width: 755px; } }
    @keyframes expandBar2 { from { width: 0px; } to { width: 578px; } }
    @keyframes expandBar3 { from { width: 0px; } to { width: 678px; } }
    @keyframes expandBar4 { from { width: 0px; } to { width: 616px; } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #00FFFF); } }

    .bar-anim-1 { animation: expandBar1 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-anim-2 { animation: expandBar2 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-anim-3 { animation: expandBar3 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-anim-4 { animation: expandBar4 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .pulse-dot { animation: pulseGlow 2.5s infinite ease-in-out; transform-origin: 6px 6px; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="838" height="378" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Decorative Header -->
  <g transform="translate(35, 42)">
    <circle cx="6" cy="6" r="5" fill="#00FFFF" class="pulse-dot"/>
    <text x="24" y="11" class="title">TECHNICAL MASTERY &amp; PROFICIENCY MATRIX</text>
    <text x="770" y="11" text-anchor="end" class="subtitle">Sajid Mahmud Sayan · Live Skill Index</text>
  </g>

  <!-- Skill Row 1: UI & Frontend (MASTER) -->
  <g transform="translate(35, 80)">
    <text x="0" y="18" class="skill-title">💎 UI &amp; Frontend Architecture</text>
    <rect x="250" y="3" width="76" height="20" rx="5" fill="#00FFFF" fill-opacity="0.12" stroke="#00FFFF" stroke-width="1"/>
    <text x="288" y="17" text-anchor="middle" class="badge-text" fill="#00FFFF">MASTER</text>
    <text x="770" y="18" text-anchor="end" class="pct-text" fill="#00FFFF">98%</text>
    
    <!-- Progress Bar Track -->
    <rect x="0" y="28" width="770" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="28" height="8" rx="4" fill="url(#gradMaster)" class="bar-anim-1" filter="url(#neonGlow)"/>
    
    <text x="0" y="52" class="skill-tags">Next.js · Three.js · HTML5 · CSS3 · Modern JavaScript · Interactive WebGL · Animations</text>
  </g>

  <!-- Skill Row 2: Full-Stack & Backend (INTERMEDIATE) -->
  <g transform="translate(35, 150)">
    <text x="0" y="18" class="skill-title">⚡ Full-Stack &amp; Backend Engineering</text>
    <rect x="305" y="3" width="108" height="20" rx="5" fill="#818CF8" fill-opacity="0.12" stroke="#818CF8" stroke-width="1"/>
    <text x="359" y="17" text-anchor="middle" class="badge-text" fill="#A5B4FC">INTERMEDIATE</text>
    <text x="770" y="18" text-anchor="end" class="pct-text" fill="#A5B4FC">75%</text>

    <!-- Progress Bar Track -->
    <rect x="0" y="28" width="770" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="28" height="8" rx="4" fill="url(#gradInter)" class="bar-anim-2"/>

    <text x="0" y="52" class="skill-tags">Full-Stack Integration · REST APIs · Backend Architecture · Node.js · Scalable Services</text>
  </g>

  <!-- Skill Row 3: AI & Prompt Engineering (ADVANCED) -->
  <g transform="translate(35, 220)">
    <text x="0" y="18" class="skill-title">🤖 Prompt Engineering &amp; AI Systems</text>
    <rect x="300" y="3" width="94" height="20" rx="5" fill="#F43F5E" fill-opacity="0.12" stroke="#F43F5E" stroke-width="1"/>
    <text x="347" y="17" text-anchor="middle" class="badge-text" fill="#FDA4AF">ADVANCED</text>
    <text x="770" y="18" text-anchor="end" class="pct-text" fill="#FDA4AF">88%</text>

    <!-- Progress Bar Track -->
    <rect x="0" y="28" width="770" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="28" height="8" rx="4" fill="url(#gradPrompt)" class="bar-anim-3"/>

    <text x="0" y="52" class="skill-tags">System Prompts · Structured Contexts · LLM Pipelines · Autonomous Agent Workflows</text>
  </g>

  <!-- Skill Row 4: SQLite Database (PROFICIENT) -->
  <g transform="translate(35, 290)">
    <text x="0" y="18" class="skill-title">💾 SQLite Database Architecture</text>
    <rect x="270" y="3" width="105" height="20" rx="5" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1"/>
    <text x="322" y="17" text-anchor="middle" class="badge-text" fill="#6EE7B7">EXPERIENCED</text>
    <text x="770" y="18" text-anchor="end" class="pct-text" fill="#6EE7B7">80%</text>

    <!-- Progress Bar Track -->
    <rect x="0" y="28" width="770" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="28" height="8" rx="4" fill="url(#gradSql)" class="bar-anim-4"/>

    <text x="0" y="52" class="skill-tags">SQLite Database Engine · Relational Schemas · Query Optimization · Persistent Storage</text>
  </g>
</svg>
